<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Teslimat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus {
            border-color: #6c5ce7;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }
        button:hover { transform: translateY(-2px); opacity: 0.95; }
        button:active { transform: translateY(0); }
        .error {
            background: rgba(255,70,70,0.2);
            border: 1px solid rgba(255,70,70,0.4);
            color: #ff8a8a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎮 Hesap Teslimat</h1>
        <p class="subtitle">Satın aldığınız hesabın kodunu girin</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/check">
            <label for="code">Teslimat Kodu</label>
            <input type="text" id="code" name="code" placeholder="ÖRNEK: A7K9X2M1" required autocomplete="off" autofocus>
            <button type="submit">Hesabı Getir</button>
        </form>
    </div>
</body>
</html>
