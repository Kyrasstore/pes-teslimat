<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Giriş</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: #16213e;
            border-radius: 16px;
            padding: 36px 28px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        h1 { text-align: center; margin-bottom: 24px; font-size: 1.4rem; }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #0f0f23;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: #6c5ce7; }
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #6c5ce7;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .error {
            background: rgba(255,70,70,0.15);
            color: #ff8a8a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Admin Giriş</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Admin şifresi" required autofocus>
            <button type="submit">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
